<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/home.css">

</head>

<body>
    <main>
        <header class="header-bar">
            <nav class="nav-bar">
                <div class="logo-bar">
                    <a href="home.html" class="logo">
                        <img class="logo" src="images/logo.png" alt="brand logo">
                    </a>
                </div>
                <div class="nav-menu">
                    <a href="home.html" class="nav-item">Home</a>
                    <a href="events.html" class="nav-item">Events</a>
                    <a href="blog.html" class="nav-item">Blog</a>
                    <a href="login.html" class="nav-login">
                        <button class="nav-button">Log in</button>
                    </a>
                    <a href="signup.html" class="nav-signup">
                        <button class="nav-button">Sign up</button>
                    </a>
                </div>
            </nav>
            <section class="header-body">
                <a class="kpop-team">
                    <img src="images/kpop.png" alt="kpop-team" class="kpop-image">
                </a>
                <div class="kpop-description">
                    <h1 class="titre1">Eventick</h1>
                    <p class="description-home">Look no further! Our SBS The show tickets are the simplest way for you

                    <div class="events-blog-buttons">
                        <a href="events.html" class="events-button-cadre">
                            <button class="events-button">Events</button>
                        </a>
                        <a href="blog.html" class="blog-button-cadre">
                            <button class="blog-button">Blog</button>
                        </a>
                    </div>
                </div>
            
            </section>
        </header>
        <nav class="search-bar-nav">
            <div class="research-bar">
                <div class="search-bar">
                    <label class="search-text" for="search">Search Event</label>
                    <input type="text" class="search-input" placeholder="Konser Jazz">
                </div>
                <div class="place-bar">
                    <label class="place-text" for="place">Place</label>
                    <input type="text" class="place-input" placeholder="Konser Jazz">
                </div>
                <div class="time-bar">
                    <label class="time-text" for="time">Time</label>
                    <select name="date" class="date-bar">
                        <option value="Any date">Any date</option>
                        <option value="This week">This week</option>
                        <option value="This mounth">This mounth</option>
                        <option value="This year">This year</option>
                    </select>
                </div>
            </div>
